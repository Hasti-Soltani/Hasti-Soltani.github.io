
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f3b48">

  <title>{{ page.title }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>

    :root {
      --bg: #f1f4f7;
      --surface: #ffffff;
      --ink: #1f262e;
      --muted: #5f6b78;
      --line: #dce2e9;
      --accent: #15699f;
      --accent-soft: #dcecf7;
      --sky: #5bb5e6;
      --hero-a: #2f3b48;
      --hero-b: #3f6f94;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12161b;
        --surface: #1b2128;
        --ink: #e9edf1;
        --muted: #9aa6b2;
        --line: #2b333c;
        --accent: #7cc4ee;
        --accent-soft: #1f3342;
        --sky: #7cc4ee;
        --hero-a: #1a2028;
        --hero-b: #26485f;
      }
    }

    /* Global settings */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      direction: ltr !important;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.75;
      direction: ltr !important;
      text-align: left !important;
    }

    a {
      color: var(--accent);
      text-underline-offset: 4px;
    }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* Hero section */

    .hero {
      background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
      color: #fff;
      padding: 4rem 1.25rem 4.5rem;
      border-bottom: 5px solid var(--sky);
      direction: ltr !important;
      text-align: left !important;
    }

    .hero-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 1.75rem;
      flex-wrap: wrap;
      direction: ltr !important;
      text-align: left !important;
    }

    .avatar {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.55);
      background: #fff;
      flex-shrink: 0;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.3rem, 8vw, 3.8rem);
      font-weight: 800;
      line-height: 1.25;
      text-align: left !important;
    }

    .hero p {
      margin: 0.5rem 0 0;
      font-size: 1.15rem;
      color: rgba(255, 255, 255, 0.85);
      max-width: 44ch;
      text-align: left !important;
    }

    /* Main content */

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
      direction: ltr !important;
      text-align: left !important;
    }

    main * {
      direction: ltr !important;
      text-align: left !important;
    }

    main > p:first-child {
      margin-top: 2.5rem;
    }

    /* Section headings */

    h2 {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.7rem;
      font-size: 1.5rem;
      margin: 3rem 0 1.1rem;
      direction: ltr !important;
      text-align: left !important;
    }

    h2::before {
      content: "";
      width: 6px;
      height: 1.4rem;
      border-radius: 3px;
      background: var(--sky);
      flex-shrink: 0;
    }

    /* Skills and interests tags */

    ul.tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 0.6rem;
      padding: 0;
      list-style: none;
      direction: ltr !important;
    }

    ul.tags li {
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.1rem 1rem;
      border-radius: 999px;
      font-weight: 500;
      font-size: 0.95rem;
      direction: ltr !important;
    }

    /* Project and education cards */

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-inline-start: 5px solid var(--sky);
      border-radius: 12px;
      padding: 1.1rem 1.4rem;
      margin-bottom: 1.1rem;
      direction: ltr !important;
      text-align: left !important;
    }

    .card h3 {
      margin: 0 0 0.3rem;
      font-size: 1.2rem;
      text-align: left !important;
    }

    .card p {
      margin: 0.3rem 0;
      color: var(--muted);
      font-size: 0.98rem;
      text-align: left !important;
    }

    .card em {
      font-size: 0.88rem;
      color: var(--muted);
      font-style: normal;
    }

    /* Contact links */

    ul.links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 0.75rem;
      padding: 0;
      list-style: none;
      direction: ltr !important;
    }

    ul.links a {
      display: inline-block;
      padding: 0.45rem 1.2rem;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      text-decoration: none;
      font-weight: 500;
    }

    ul.links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Code */

    code {
      direction: ltr;
      unicode-bidi: embed;
      background: var(--accent-soft);
      padding: 0 0.35rem;
      border-radius: 4px;
    }

    /* Footer */

    footer {
      text-align: center;
      direction: ltr !important;
      color: var(--muted);
      font-size: 0.88rem;
      padding: 1.8rem 1rem;
      border-top: 1px solid var(--line);
    }

    /* Responsive design */

    @media (max-width: 600px) {

      .hero {
        padding: 3rem 1.25rem;
      }

      .hero-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .avatar {
        width: 112px;
        height: 112px;
      }

      .hero h1 {
        font-size: 2.3rem;
      }

      main {
        padding-left: 1.25rem;
        padding-right: 1.25rem;
      }

    }

  </style>
</head>

<body>

  <header class="hero">

    <div class="hero-inner">

      {% if page.image %}
      <img
        class="avatar"
        src="{{ page.image | relative_url }}"
        alt="Photo of {{ page.title }}">
      {% endif %}

      <div>
        <h1>{{ page.title }}</h1>

        {% if page.subtitle %}
        <p>{{ page.subtitle }}</p>
        {% endif %}
      </div>

    </div>

  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    © 2026 {{ page.title }}
  </footer>

</body>
</html>
