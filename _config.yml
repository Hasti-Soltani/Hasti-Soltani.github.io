
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f8">
  <title>{{ page.title }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --ink: #24364a;
      --muted: #718092;
      --line: #dce3e9;
      --blue: #7faecc;
      --blue-light: #e5eff6;
      --blue-dark: #45677e;
      --footer: #48677b;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 85px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", sans-serif;
      font-size: 15px;
      line-height: 1.8;
      direction: ltr;
      text-align: left;
    }

    a {
      color: var(--blue-dark);
      text-decoration: none;
    }

    a:hover {
      color: var(--blue);
    }

    /* Navigation */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(247,248,250,.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .nav-inner {
      max-width: 1100px;
      margin: auto;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      color: var(--ink);
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border: 1px solid var(--blue-dark);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      font-size: 12px;
    }

    .nav-links {
      display: flex;
      gap: 26px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    /* Sections */

    .section {
      padding: 75px 25px;
      scroll-margin-top: 75px;
    }

    .section-inner {
      max-width: 950px;
      margin: auto;
    }

    .section-label {
      color: var(--blue-dark);
      font-family: Georgia, serif;
      font-size: 12px;
      font-style: italic;
      margin-bottom: 16px;
    }

    .section-title,
    .about-heading {
      font-family: "DM Serif Display", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2.5rem, 5vw, 3.7rem);
      line-height: 1.08;
      letter-spacing: -1px;
      margin: 0;
    }

    /* About */

    .about {
      background: var(--bg);
      padding-top: 55px;
      padding-bottom: 75px;
    }

    .about-grid {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 55px;
    }

    .about-heading {
      max-width: 320px;
      font-size: clamp(3rem, 5vw, 4rem);
    }

    .about-content {
      border-left: 1px solid var(--blue);
      padding-left: 28px;
    }

    .about-content .lead {
      font-family: "DM Serif Display", Georgia, serif;
      font-size: clamp(1.4rem, 2.5vw, 1.8rem);
      line-height: 1.4;
      margin: 0 0 20px;
    }

    .about-content p:not(.lead) {
      color: var(--muted);
      font-size: 13px;
    }

    .about-meta {
      border-top: 1px solid var(--line);
      margin-top: 30px;
      padding-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .meta-label {
      display: block;
      color: var(--blue-dark);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .meta-value {
      font-size: 12px;
      font-weight: 600;
    }

    /* Skills */

    .skills-section {
      background: var(--blue-light);
    }

    .two-column {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 55px;
    }

    .skills-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0 25px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .skills-list li {
      padding: 12px 3px;
      border-bottom: 1px solid #cbdbe6;
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 18px;
    }

    /* Education */

    .education-section {
      background: var(--bg);
    }

    .education-item {
      border-top: 1px solid var(--line);
      padding: 20px 0;
    }

    .education-item h3 {
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 21px;
      font-weight: 400;
      margin: 0;
    }

    .education-item p {
      color: var(--muted);
      font-size: 13px;
      margin: 3px 0 0;
    }

    /* Interests */

    .interests-section {
      background: #edf0f3;
    }

    .interest-list {
      padding-left: 20px;
      margin: 0;
    }

    .interest-list li {
      padding: 3px 0;
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 18px;
    }

    /* Projects */

    .projects-section {
      background: var(--bg);
    }

    .project-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid var(--blue);
      border-radius: 8px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      min-height: 215px;
      transition: transform .2s, box-shadow .2s;
    }

    .project-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(36,54,74,.07);
    }

    .project-card h3 {
      font-family: "DM Serif Display", Georgia, serif;
      font-weight: 400;
      font-size: 23px;
      margin: 0 0 10px;
    }

    .project-card p {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 12px;
    }

    .project-card em {
      color: var(--blue-dark);
      font-size: 11px;
      font-style: italic;
      margin-top: auto;
    }

    .project-link {
      font-size: 12px;
      font-weight: 600;
      margin: 8px 0 12px;
    }

    /* Notes */

    .notes-section {
      background: var(--blue-light);
    }

    .note-item {
      border-left: 2px solid var(--blue);
      padding-left: 25px;
    }

    .note-item h3 {
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 23px;
      font-weight: 400;
      margin: 0;
    }

    .note-item p {
      color: var(--muted);
      font-size: 13px;
    }

    /* Contact */

    .contact-section {
      background: var(--footer);
      color: white;
    }

    .contact-section .section-label {
      color: #c5d9e6;
    }

    .contact-section .section-title {
      color: white;
    }

    .contact-section p {
      color: #e0e9ef;
      font-size: 13px;
    }

    .contact-content {
      border-left: 1px solid #9bb4c5;
      padding-left: 25px;
    }

    ul.links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0;
      list-style: none;
    }

    ul.links a {
      display: inline-block;
      padding: 7px 20px;
      border: 1px solid #c5d9e6;
      border-radius: 30px;
      color: white;
      font-size: 12px;
    }

    ul.links a:hover {
      background: white;
      color: var(--footer);
    }

    /* Footer */

    footer {
      background: var(--footer);
      color: #d5e0e8;
      text-align: center;
      padding: 18px;
      border-top: 1px solid rgba(255,255,255,.2);
      font-size: 11px;
    }

    /* Responsive */

    @media (max-width: 700px) {
      .nav-inner {
        flex-wrap: wrap;
      }

      .nav-links {
        width: 100%;
        gap: 18px;
        overflow-x: auto;
      }

      .section {
        padding: 55px 22px;
      }

      .about-grid,
      .two-column {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .about-content,
      .contact-content {
        padding-left: 18px;
      }

      .about-meta {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .project-list {
        grid-template-columns: 1fr;
      }

      .section-title {
        font-size: 2.7rem;
      }
    }

    @media (max-width: 380px) {
      .nav-links {
        gap: 13px;
      }

      .nav-links a {
        font-size: 11px;
      }

      .skills-list {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>

<body>

  <nav class="navbar">
    <div class="nav-inner">

      <a href="#about" class="brand">
        <span class="brand-mark">HS</span>
        Hasti Soltani
      </a>

      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#education">Education</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>

    </div>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer>
    © 2026 Hasti Soltani
  </footer>

</body>
</html>
